<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai đẹp trai nhất?</title>
    <style>
      
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            z-index: 10;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }

        
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            min-width: 100px;
        }

        
        #btnThien {
            background-color: #2ecc71;
            color: white;
        }

        #btnThien:hover {
            transform: scale(1.1);
            background-color: #27ae60;
        }

       
        #btnPhuc {
            background-color: #e74c3c;
            color: white;
            position: relative; 
        }

       
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px #2ecc71;
        }

        .modal h2 { color: #2ecc71; margin-top: 0; }
        .modal button { background: #333; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ai là người đẹp trai nhất?</h1>
        <div class="btn-container">
            <button id="btnThien" onclick="win()">Thiện</button>
            <button id="btnPhuc" onmouseover="runAway(this)" onclick="runAway(this)">Phúc</button>
        </div>
    </div>

    <div id="overlay">
        <div class="modal">
            <h2>Chính xác! 🥳</h2>
            <p>Bạn có mắt thẩm mỹ rất tốt đấy.</p>
            <button onclick="location.reload()">Chơi lại</button>
        </div>
    </div>

    <script>
        function runAway(btn) {
            
            btn.style.position = 'fixed';
            
            
            const padding = 50;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;

            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            
            btn.style.transition = 'all 0.2s ease';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function win() {
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
